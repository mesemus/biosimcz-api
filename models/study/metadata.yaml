# Definition of metadata for study. Please do not add ccmm model here,
# add the ccmm_preset instead.
Metadata:
  title: GROMACS Simulation Schema
  description: >-
    This schema defines the structure of metadata and parameters used in a GROMACS
    simulation environment.
  properties:
    administrative:
      properties:
        software_information:
          type: object
          title: Software Information
          description: Details of the software environment used to perform the simulation.
          properties:
            software:
              type: fulltext
              title: Software Name
              description: 'Name of the molecular dynamics package (e.g., ''GROMACS'').'
            version:
              type: fulltext
              title: Software Version
              description: 'Version of the software used (e.g., ''2023.1'').'
      type: object
    simulated_object:
      properties:
        protein_id:
          title: Protein Identification
          description: >-
            Enter either the PDB ID or the Uniprot ID, more than one protein can
            be entered
          type: array
          items:
            type: object
            properties:
              type:
                title: Identifier Source
                type: fulltext
                enum:
                  - PDB ID
                  - Uniprot ID
              identifier:
                title: Structure ID
                type: fulltext
            required:
              - type
              - identifier
        ligand_id:
          title: Ligand Identification
          description: Enter a ligand identifier from a recognized database
          type: array
          items:
            type: object
            properties:
              type:
                title: Identifier Source
                type: fulltext
                enum:
                  - PDB Ligand ID
                  - PubChem CID
                  - ChEMBL ID
                  - DrugBank ID
                  - ZINC ID
                  - HMDB ID
                  - KEGG Compound ID
              identifier:
                title: Ligand ID
                type: fulltext
            required:
              - type
              - identifier
        solvent:
          type: object
          properties:
            type:
              title: Solvent Type
              type: fulltext
              enum:
                - Water
                - Water and Ions
                - Water and Organic Solvent
                - Other
            name:
              title: Solvent Name
              type: fulltext
            concentration:
              title: Solvent Concentration
              description: Concentration of the solvent in the simulation box in mol/L
              type: float
      type: object

