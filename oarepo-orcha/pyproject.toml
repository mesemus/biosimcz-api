[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "oarepo-orcha"
version = "0.1.0"
description = "Connection to invenio orcha"
readme = "README.md"
license = "MIT"
dependencies = [
    "oarepo[rdm,tests]>=14.2.1b11.dev1,<15.0.0",
    "oarepo-invenio-typing-stubs>=0.1.0",   # dependency on Descriptor for typed system fields
    "oarepo-model>=5.0.0,<6.0.0",
    "oarepo-requests>=9.0.0,<10.0.0",
]
requires-python = ">=3.14,<3.15"

[project.optional-dependencies]
dev = [
    "pytest-invenio",
]
tests = [
    "pytest-invenio",
    "pytest-oarepo",
    "deepmerge==2.1"
]
oarepo14 = [
    "oarepo[rdm]>=14,<15",
]

#[project.entry-points."invenio_celery.tasks"]
#oarepo_orcha = "oarepo_orcha.tasks"

#[project.entry-points."invenio_base.api_apps"]
#oarepo_orcha = "oarepo_orcha.ext:OARepoChecks"

#[project.entry-points."invenio_base.apps"]
#oarepo_orcha = "oarepo_orcha.ext:OARepoChecks"

#[project.entry-points."invenio_checks.check_types"]
#llm_check = "oarepo_orcha.checks.llm_check:LLMCheck"

[project.entry-points."invenio_base.blueprints"]
oarepo_orcha = "oarepo_orcha.views:blueprint"

[project.entry-points."invenio_base.api_blueprints"]
oarepo_orcha = "oarepo_orcha.views:blueprint"

#[project.entry-points."flask.commands"]
#checks = "oarepo_orcha.cli:checks"

[project.entry-points."invenio_i18n.translations"]
oarepo_orcha = "oarepo_orcha"

[project.entry-points."invenio_assets.webpack"]
oarepo_orcha = "oarepo_orcha.theme.webpack:theme"

[tool.hatch.build.targets.sdist]
include = [
    "/oarepo_orcha",
]

[tool.hatch.build.targets.wheel]
packages = ["oarepo_orcha"]

[tool.hatch.build]
include = [
    "oarepo_orcha/",
]

[tool.pytest.ini_options]
    testpaths = [
        "tests"
    ]

[tool.hatch.metadata]
allow-direct-references = true
